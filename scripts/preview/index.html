<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corvus preview</title>
    <script src="lucide.js"></script>
    
    <script src="enhance.js"></script>
    
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="main.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      
      
      .workspace-drawer-inner,
      .workspace-drawer-tab-container,
      .workspace-drawer-active-tab-container,
      .workspace-drawer-active-tab-content,
      .workspace-tab-container,
      .preview-plain-chain,
      .workspace-leaf,
      .workspace-leaf-content {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .workspace-drawer-inner,
      .workspace-drawer-tab-container,
      .workspace-drawer-active-tab-container,
      .workspace-drawer-active-tab-content,
      .workspace-tab-container,
      .preview-plain-chain,
      .workspace-leaf,
      .workspace-leaf-content {
        flex: 1 1 auto;
      }
      .workspace-drawer-header,
      .view-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        padding: 8px 12px;
        background: var(--background-secondary);
        border-bottom: 1px solid var(--background-modifier-border);
        color: var(--text-muted);
        font-size: 13px;
      }
      
      #behind {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background-primary-alt, #111);
        color: var(--text-faint);
        font-size: 13px;
      }
      i[data-lucide] {
        display: inline-flex;
      }
      
      svg.lucide {
        width: var(--icon-size, 18px);
        height: var(--icon-size, 18px);
      }
      
      .mobile-navbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--navbar-height, 48px);
        background: var(--background-secondary);
        border-top: 1px solid var(--background-modifier-border);
        margin-bottom: calc(0px - var(--keyboard-height));
      }
      body.preview-kb::after {
        content: "keyboard";
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: var(--keyboard-height);
        background: repeating-linear-gradient(
          45deg,
          #2a2a2a,
          #2a2a2a 10px,
          #333 10px,
          #333 20px
        );
        color: #888;
        font-size: 12px;
      }
      body.preview-kb .app-container {
        max-height: calc(100vh - var(--keyboard-height));
      }
      .preview-menu {
        position: fixed;
        z-index: 99;
        display: flex;
        flex-direction: column;
        min-width: 180px;
        padding: 4px;
        border: 1px solid var(--background-modifier-border);
        border-radius: 10px;
        background: var(--background-secondary);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .preview-menu button {
        padding: 8px 10px;
        background: transparent;
        box-shadow: none;
        text-align: left;
        font-size: 13px;
      }
    </style>
  </head>
  <body class="theme-dark is-mobile is-phone">
    
    <div id="behind">editor behind (workspace)</div>
    <div class="app-container">
      <div class="workspace-drawer mod-right" id="drawer">
        <div class="workspace-drawer-inner">
          <div class="workspace-drawer-header">
            <div class="workspace-drawer-header-name">Corvus</div>
          </div>
          
          <div class="workspace-drawer-tab-container">
            <div class="workspace-drawer-active-tab-container">
              <div class="workspace-drawer-tab-options">
                <div class="workspace-tab-header workspace-drawer-tab-select">
                  <div class="workspace-tab-header-inner">
                    <span class="workspace-tab-header-inner-icon"></span>
                    <span class="workspace-tab-header-inner-title">Corvus</span>
                    <span class="workspace-tab-header-inner-chevron"></span>
                  </div>
                </div>
                <div class="workspace-drawer-tab-options-list"></div>
              </div>
              <div class="workspace-drawer-active-tab-content">
                
                <div class="__TAB_CONTAINER__">
                
                <div class="workspace-leaf corvus-leaf">
                  <div
                    class="workspace-leaf-content"
                    data-type="corvus"
                    data-mode="preview"
                  >
                    <div class="view-header"><span>Corvus</span></div>
                    <div class="view-content" id="app"></div>
                  </div>
                </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="mobile-navbar"></div>
    </div>
    <script>

      (function () {
        const short = new URLSearchParams(location.search).get("chain") === "short";
        const el = document.querySelector(".__TAB_CONTAINER__");
        if (el) el.className = short ? "preview-plain-chain" : "workspace-tab-container";
      })();

      const q = new URLSearchParams(location.search);
      if (q.get("theme") === "light") {
        document.body.classList.replace("theme-dark", "theme-light");
      }
      if (q.get("device") === "desktop") {

        document.body.classList.remove("is-mobile", "is-phone");
      }

      if (q.get("mic") === "fake") {
        navigator.mediaDevices = navigator.mediaDevices || {};

        let fakeCtx = null;

        window.__fakeTracks = [];

        const micDelay = Number(q.get("micdelay") ?? 0);
        navigator.mediaDevices.getUserMedia = async () => {
          if (micDelay) await new Promise((r) => setTimeout(r, micDelay));
          fakeCtx = fakeCtx || new AudioContext();
          const dest = fakeCtx.createMediaStreamDestination();
          const osc = fakeCtx.createOscillator();
          const gain = fakeCtx.createGain();
          osc.frequency.value = 220;
          osc.connect(gain).connect(dest);
          osc.start();

          const falaMs = Number(q.get("falamos") ?? 3000);
          const pausaMs = Number(q.get("pausa") ?? 700);
          if (q.get("tom") === "continuo") {
            gain.gain.value = 0.3;
          } else {
            const t0 = fakeCtx.currentTime;
            const ciclo = (falaMs + pausaMs) / 1000;
            gain.gain.setValueAtTime(0.3, t0);
            for (let k = 0; k < 120; k++) {
              const inicio = t0 + k * ciclo;
              gain.gain.setValueAtTime(0.3, inicio);
              gain.gain.setValueAtTime(0.0001, inicio + falaMs / 1000);
            }
          }
          window.__fakeTracks.push(...dest.stream.getTracks());
          return dest.stream;
        };
      }

      const kb = Number(q.get("kb") ?? 0);
      document.documentElement.style.setProperty("--keyboard-height", kb + "px");
      document.body.classList.toggle("preview-kb", kb > 0);

      const drawer = document.getElementById("drawer");
      drawer.classList.toggle("corvus-keyboard-open", kb > 0);
      document.body.classList.toggle("corvus-keyboard-open", kb > 0);

      const drawerFixed = q.get("drawer") === "fixed";
      const syncKb = () => {
        drawer.style.height =
          kb > 0 && !drawerFixed ? window.innerHeight - kb + "px" : "";
      };
      syncKb();
      window.addEventListener("resize", syncKb);
      window.visualViewport?.addEventListener("resize", syncKb);

      document.body.classList.toggle("is-hidden-nav", q.get("nav") === "hidden");

      if (q.get("nav") === "none") document.querySelector(".mobile-navbar")?.remove();
      document.body.classList.toggle(
        "corvus-has-navbar",
        document.querySelector(".mobile-navbar") !== null
      );
      const fs = q.get("fs") === "1";
      drawer.classList.toggle("corvus-fullscreen", fs);
      document.body.classList.toggle("corvus-fullscreen", fs);

    </script>
    <script src="bundle.js"></script>
    <script>

      const hidratar = () =>
        window.lucide?.createIcons({ nameAttr: "data-lucide" });
      setTimeout(hidratar, 60);
      let agendado = null;
      new MutationObserver(() => {
        if (agendado !== null) return;
        agendado = requestAnimationFrame(() => {
          agendado = null;
          hidratar();
        });
      }).observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
