name: Weekly hot-ranking update

# Collects the real model popularity (HuggingFace) and commits
# src/providers/hotData.generated.ts IF it changed. Every Thursday 09:00 UTC.
# Idempotent: no data change → no diff → no commit.

on:
  schedule:
    - cron: "0 9 * * 4" # Thursday, 09:00 UTC
  workflow_dispatch: {} # allows running manually from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect hot ranking
        run: node scripts/collect-hot.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet src/providers/hotData.generated.ts; then
            echo "No popularity change — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/providers/hotData.generated.ts
            git commit -m "chore(data): weekly hot ranking update"
            git push
          fi
