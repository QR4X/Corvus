name: Release Obsidian plugin

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (empty = use manifest.json)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve tag
        id: tag
        run: |
          if [ "${GITHUB_REF}" = "${GITHUB_REF#refs/tags/}" ]; then
            tag="${{ github.event.inputs.version }}"
            if [ -z "$tag" ]; then
              tag=$(node -p "require('./manifest.json').version")
            fi
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      - name: Check tag matches manifest version
        id: kind
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          ver=$(node -p "require('./manifest.json').version")
          case "$tag" in
            *-*)
              base="${tag%%-*}"
              newer=$(node -e "const a='$base'.split('.').map(Number),b='$ver'.split('.').map(Number);let r=0;for(let i=0;i<3;i++){if(a[i]!==b[i]){r=a[i]>b[i]?1:-1;break}}console.log(r>0?'yes':'no')")
              if [ "$newer" != "yes" ]; then
                echo "::error::Pre-release $tag must be greater than stable ($ver) — e.g. the next version with -beta.N."
                exit 1
              fi
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "OK: pre-release $tag (stable in the repository: $ver)"
              ;;
            *)
              if [ "$tag" != "$ver" ]; then
                echo "::error::Tag ($tag) != manifest.json ($ver). Bump the manifest before tagging."
                exit 1
              fi
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "OK: $tag == $ver"
              ;;
          esac

      - name: Stamp pre-release version
        if: steps.kind.outputs.prerelease == 'true'
        run: |
          TAG="${{ steps.tag.outputs.tag }}" node -e "const fs=require('fs');const f='output/manifest.json';const m=JSON.parse(fs.readFileSync(f,'utf8'));m.version=process.env.TAG;fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n');console.log('pre-release manifest:',m.version)"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            output/main.js
            output/styles.css

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do."
            exit 0
          fi
          if [ "${{ steps.kind.outputs.prerelease }}" = "true" ]; then
            gh release create "$tag" \
              --title "$tag (test)" \
              --target "${GITHUB_SHA}" \
              --prerelease --latest=false \
              --notes "TEST build of Corvus ($tag), to install via BRAT. Not the Obsidian directory version." \
              output/main.js output/manifest.json output/styles.css
          else
            gh release create "$tag" \
              --title "$tag" \
              --target "${GITHUB_SHA}" \
              --notes "Corvus $tag. See the commits for the changelog." \
              output/main.js output/manifest.json output/styles.css
          fi
